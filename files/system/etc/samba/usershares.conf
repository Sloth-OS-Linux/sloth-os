# Sloth OS: shared folders (Sloth Center → Disks → Share a folder, Dolphin → Share)
[global]
	usershare max shares = 100
	usershare allow guests = yes
	usershare owner only = yes
	winbind enum groups = yes
	# a share without a password: its own account, not nobody (sysusers.d/sloth-os-guest.conf, file-sharing's
	# guest_access); here, not in smb.conf, so it survives joining a domain
	guest account = sloth-guest
	# map to guest: Bad User only while a folder is shared without a password, otherwise Never, so that Windows asks
	# for the password (file-sharing writes it: with Bad User, Windows' own unknown user name came in as the guest,
	# was refused at a password share and never asked); after the line above, so it wins over smb.conf
	include = /etc/samba/sloth-guest.conf
	# not announced by Samba itself (it would be visible with nothing shared, on any network): file-sharing writes
	# Avahi's announcement only while a folder is shared on the home network. Here, not in smb.conf: joining a
	# domain rewrites smb.conf, and sloth-helper puts this file's include back
	multicast dns register = no
