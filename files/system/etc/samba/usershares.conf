# Sloth OS: shared folders (Sloth Center → Disks → Share a folder, Dolphin → Share)
[global]
	usershare max shares = 100
	usershare allow guests = yes
	usershare owner only = yes
	winbind enum groups = yes
	# not announced by Samba itself (it would be visible with nothing shared, on any network): file-sharing writes
	# Avahi's announcement only while a folder is shared on the home network. Here, not in smb.conf: joining a
	# domain rewrites smb.conf, and sloth-helper puts this file's include back
	multicast dns register = no
