# Sloth OS: Samba only serves the folders shared from Sloth Center or Dolphin (usershares); turning a share on always
# needs the administrator password in Sloth Center. It runs only while something is shared, and only the local
# network can reach it
# (/usr/libexec/sloth-os/file-sharing). Fedora's [homes] and printer shares are left out on purpose.
[global]
	workgroup = WORKGROUP
	security = user
	passdb backend = tdbsam
	# without a password only into a folder shared "for anyone on the home network" (guest_ok), nowhere else
	map to guest = Bad User
	server smb encrypt = desired
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes
	include = /etc/samba/usershares.conf
