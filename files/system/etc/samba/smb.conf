# Sloth OS: Samba only serves folders shared from Sloth Center or Dolphin (usershares). With no shares, the firewall
# stays closed; the running service lets Dolphin's Share tab configure a folder without first enabling Samba by hand.
# (/usr/libexec/sloth-os/file-sharing). Fedora's [homes] and printer shares are left out on purpose.
[global]
	workgroup = WORKGROUP
	security = user
	passdb backend = tdbsam
	# without a password only into a folder shared "for anyone on the home network" (guest_ok), nowhere else
	map to guest = Bad User
	server smb encrypt = desired
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes
	include = /etc/samba/usershares.conf
