# Sloth OS: titkosított rendszerlemez (a telepítőben választható).
# Az indításkori jelszókérő (Plymouth) a felhasználó billentyűzetkiosztásával fut (rd.vconsole.keymap, a telepítő
# állítja be), különben pl. magyar kiosztásnál a "z" és az "y" fel lenne cserélve. Ehhez minden kiosztás kell az
# initramfs-be; a titkosított partíció kinyitása (crypt) is legyen benne.
i18n_install_all="yes"
add_dracutmodules+=" crypt "
