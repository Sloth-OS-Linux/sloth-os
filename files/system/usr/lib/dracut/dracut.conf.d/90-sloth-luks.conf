# Sloth OS: an encrypted system disk (can be chosen in the installer).
# The password prompt at boot (Plymouth) runs with the user's keyboard layout (rd.vconsole.keymap, set by the
# installer), otherwise e.g. with a Hungarian layout "z" and "y" would be swapped. For this every layout must be in the
# initramfs; opening the encrypted partition (crypt) must be in it too.
i18n_install_all="yes"
add_dracutmodules+=" crypt "
