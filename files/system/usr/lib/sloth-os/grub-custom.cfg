# Sloth OS: the boot menu stays hidden (it can be brought up at startup by pressing Esc or Shift).
# It only appears by itself if the previous start did not get to the login screen,
# or if it was turned on in Sloth Center.
#
# bootupd's template (grub-static-pre.cfg) fixes "timeout_style=menu, timeout=1", and does not look at
# menu_auto_hide; this file ($prefix/custom.cfg) runs after it, so it can override it.
# The state is on the EFI partition (sloth-boot.env), because GRUB cannot write to btrfs.
# The installer copies it to /boot/grub2/custom.cfg (source: /usr/lib/sloth-os/grub-custom.cfg).
# The successful start is reported by the sloth-boot-ok service (sloth_boot_pending=0).

set timeout_style=hidden
set timeout=1

# Our own EFI partition's folder (EFI/fedora). ${cmdpath} is empty here: bootupd's EFI/fedora/grub.cfg loads this
# config with configfile, and it is not visible in the new environment (2026-10-20, VM test: because of this the menu never came up,
# and next to Windows the Windows entry did not either). So we look for it by the file; there is no such file on the
# Windows EFI partition. Exported, because the menu entries run in their own environment.
set sloth_dir=""
set sloth_esp=""
search --no-floppy --file --set=sloth_esp /EFI/fedora/sloth-boot.env
if [ -n "${sloth_esp}" ]; then
  set sloth_dir="(${sloth_esp})/EFI/fedora"
fi
export sloth_dir

if [ -n "${sloth_dir}" ]; then
  load_env -f "${sloth_dir}/sloth-boot.env" sloth_boot_pending sloth_show_menu sloth_reset_title
  if [ "${sloth_boot_pending}" = "1" -o "${sloth_show_menu}" = "1" ]; then
    set timeout_style=menu
    set timeout=5
  fi
  set sloth_boot_pending=1
  save_env -f "${sloth_dir}/sloth-boot.env" sloth_boot_pending

  # Installed next to Windows: starting Windows from the menu too (the installer writes it to the EFI partition; the menu
  # is shown by default then: sloth_show_menu=1)
  if [ -f "${sloth_dir}/sloth-windows.cfg" ]; then
    source "${sloth_dir}/sloth-windows.cfg"
  fi

  # Reset from the boot menu (if the machine starts but the desktop does not come up properly): the files
  # stay. The menu entry only sets a marker (sloth_reset=keep) and restarts; at the next start, before login,
  # the sloth-boot-reset service takes over, and factory-reset does it, as when requested from Sloth Center.
  # The label is in the system's language (written by sloth-boot-ok: sloth_reset_title).
  if [ -z "${sloth_reset_title}" ]; then
    set sloth_reset_title="Reset this PC (keep my files)"
  fi
  menuentry "${sloth_reset_title}" --id sloth-reset {
    set sloth_reset=keep
    set sloth_boot_pending=0
    save_env -f "${sloth_dir}/sloth-boot.env" sloth_reset sloth_boot_pending
    reboot
  }
fi
