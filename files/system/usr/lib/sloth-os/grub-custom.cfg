# Sloth OS: a boot menü rejtve marad (indításkor az Esc vagy a Shift lenyomásával előhívható).
# Csak akkor jelenik meg magától, ha az előző indítás nem jutott el a bejelentkező képernyőig,
# vagy ha a Sloth Központban bekapcsolták.
#
# A bootupd sablonja (grub-static-pre.cfg) fixen "timeout_style=menu, timeout=1"-et állít, és a
# menu_auto_hide-ot nem nézi; ez a fájl ($prefix/custom.cfg) utána fut, így felülírhatja.
# Az állapot az EFI partíción van (sloth-boot.env), mert a btrfs-re a GRUB nem tud írni.
# A telepítő másolja a /boot/grub2/custom.cfg helyére (forrás: /usr/lib/sloth-os/grub-custom.cfg).
# A sikeres indítást a sloth-boot-ok szolgáltatás jelzi (sloth_boot_pending=0).

set timeout_style=hidden
set timeout=1

if [ -f "${cmdpath}/sloth-boot.env" ]; then
  load_env -f "${cmdpath}/sloth-boot.env" sloth_boot_pending sloth_show_menu
  if [ "${sloth_boot_pending}" = "1" -o "${sloth_show_menu}" = "1" ]; then
    set timeout_style=menu
    set timeout=5
  fi
  set sloth_boot_pending=1
  save_env -f "${cmdpath}/sloth-boot.env" sloth_boot_pending
fi

# Windows mellé telepítve: a Windows indítása is a menüből (a telepítő írja az EFI partícióra, a menü ilyenkor
# alapból látszik: sloth_show_menu=1)
if [ -f "${cmdpath}/sloth-windows.cfg" ]; then
  source "${cmdpath}/sloth-windows.cfg"
fi
