# Sloth OS: a boot menü rejtve marad (indításkor az Esc vagy a Shift lenyomásával előhívható).
# Csak akkor jelenik meg magától, ha az előző indítás nem jutott el a bejelentkező képernyőig,
# vagy ha a Sloth Központban bekapcsolták.
#
# A bootupd sablonja (grub-static-pre.cfg) fixen "timeout_style=menu, timeout=1"-et állít, és a
# menu_auto_hide-ot nem nézi; ez a fájl ($prefix/custom.cfg) utána fut, így felülírhatja.
# Az állapot az EFI partíción van (sloth-boot.env), mert a btrfs-re a GRUB nem tud írni.
# A telepítő másolja a /boot/grub2/custom.cfg helyére (forrás: /usr/lib/sloth-os/grub-custom.cfg).
# A sikeres indítást a sloth-boot-ok szolgáltatás jelzi (sloth_boot_pending=0).

set timeout_style=hidden
set timeout=1

# A saját EFI-partíció mappája (EFI/fedora). A ${cmdpath} itt üres: a bootupd EFI/fedora/grub.cfg-je configfile-lal
# tölti be ezt a konfigot, és az új környezetben nem látszik (2026-10-20, VM-teszt: emiatt sosem jött elő a menü,
# és Windows mellett a Windows-bejegyzés sem). Ezért a fájl alapján keressük meg; a Windows EFI-partícióján
# ilyen fájl nincs. Exportálva, mert a menüpontok saját környezetben futnak.
set sloth_dir=""
set sloth_esp=""
search --no-floppy --file --set=sloth_esp /EFI/fedora/sloth-boot.env
if [ -n "${sloth_esp}" ]; then
  set sloth_dir="(${sloth_esp})/EFI/fedora"
fi
export sloth_dir

if [ -n "${sloth_dir}" ]; then
  load_env -f "${sloth_dir}/sloth-boot.env" sloth_boot_pending sloth_show_menu sloth_reset_title
  if [ "${sloth_boot_pending}" = "1" -o "${sloth_show_menu}" = "1" ]; then
    set timeout_style=menu
    set timeout=5
  fi
  set sloth_boot_pending=1
  save_env -f "${sloth_dir}/sloth-boot.env" sloth_boot_pending

  # Windows mellé telepítve: a Windows indítása is a menüből (a telepítő írja az EFI partícióra, a menü ilyenkor
  # alapból látszik: sloth_show_menu=1)
  if [ -f "${sloth_dir}/sloth-windows.cfg" ]; then
    source "${sloth_dir}/sloth-windows.cfg"
  fi

  # Alaphelyzetbe állítás a boot menüből (ha a gép elindul, de az asztal nem jön fel rendesen): a fájlok
  # megmaradnak. A menüpont csak jelez (sloth_reset=keep) és újraindít; a következő induláskor, bejelentkezés
  # előtt a sloth-boot-reset szolgáltatás veszi át, és a factory-reset végzi, mint a Sloth Központból kérve.
  # A felirat a rendszer nyelvén (a sloth-boot-ok írja: sloth_reset_title).
  if [ -z "${sloth_reset_title}" ]; then
    set sloth_reset_title="Reset this PC (keep my files)"
  fi
  menuentry "${sloth_reset_title}" --id sloth-reset {
    set sloth_reset=keep
    set sloth_boot_pending=0
    save_env -f "${sloth_dir}/sloth-boot.env" sloth_reset sloth_boot_pending
    reboot
  }
fi
