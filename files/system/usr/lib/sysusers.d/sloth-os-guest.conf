# Sloth OS: who opens a folder shared "without a password" (Samba's guest account, /etc/samba/usershares.conf).
# Its own account instead of nobody: file-sharing lets it pass through the home folder to the shared folder, and no
# other program runs as it, so that does not open anything to them. (No ":" in the description: sysusers refuses it.)
u sloth-guest - "Sloth OS guest for shared folders without a password" / /usr/sbin/nologin
