# Sloth OS: no Wi-Fi power saving on Ralink/MediaTek RT28xx/RT30xx cards (rt2800pci, rt2800usb); with it on they
# lose the connection after a while (GitHub issue #17). Only these drivers: other laptops keep saving power.
[connection-sloth-rt2800]
match-device=driver:rt2800pci,driver:rt2800usb
wifi.powersave=2
