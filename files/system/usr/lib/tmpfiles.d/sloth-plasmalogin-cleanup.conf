# The sign-in screen's own user (plasmalogin) never runs Windows programs, but until 2026-11-18 our user timer
# sloth-windows-prepare ran for it too (now ConditionUser=!@system) and downloaded umu's Steam runtime and Proton into
# its home. Removed at every start; nothing of the greeter's own is in these folders.
R /var/lib/plasmalogin/.local/share/umu
R /var/lib/plasmalogin/.local/share/Steam/compatibilitytools.d
R /var/lib/plasmalogin/.cache/umu
R /var/lib/plasmalogin/.cache/sloth-os
R /var/lib/plasmalogin/.cache/sloth-windows-prepare.*
