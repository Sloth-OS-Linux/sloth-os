# The sign-in PIN's files (/usr/libexec/sloth-os/pin-verifier): root only. Before 2026-11-25 the PIN's hash was
# readable by the user's group (the lock screen checked in the user's name); now the root service checks.
d /etc/sloth-os/pin 0700 root root -
z /etc/sloth-os/pin 0700 root root -
d /var/lib/sloth-os/pin 0700 root root -
z /var/lib/sloth-os/pin 0700 root root -
