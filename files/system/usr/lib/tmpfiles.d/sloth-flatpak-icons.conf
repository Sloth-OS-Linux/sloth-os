# A Flatpak-appok ikonjainak mappája már az első bejelentkezéskor legyen meg.
# A Plasma az ikonmappákat induláskor térképezi fel; ha ez csak az első app telepítésekor jön létre
# (nálunk nincs előtelepített app), a frissen telepített appoknak a kijelentkezésig nincs ikonjuk.
d /var/lib/flatpak/exports/share/icons/hicolor 0755 root root -
