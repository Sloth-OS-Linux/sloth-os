# Sloth OS: default settings of the login screen (Plasma Login Manager).
# It takes the colors and the theme from /etc/xdg/kdeglobals (Sloth Silver, org.slothos.desktop).
# The user can override it in System Settings > Login Screen.
[Greeter]
WallpaperPluginId=org.kde.image
ShowClock=true

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/SlothOS-metallic-sloth-over-silver-waves/
