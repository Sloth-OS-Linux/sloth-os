# Sloth OS: Ralink/MediaTek RT28xx/RT30xx Wi-Fi cards (rt2800pci, rt2800usb) drop off the network after a while with
# their hardware encryption on (GitHub issue #17: an RT2790 in a Lite-On HP WN7600R). With it off the CPU encrypts,
# which costs next to nothing on these 802.11n cards.
options rt2800pci nohwcrypt=1
options rt2800usb nohwcrypt=1
