# Sloth OS: our installer keeps /boot on the system partition, so systemd-gpt-auto-generator sets up this
# automount by itself. When it expired after a few idle minutes, systemd stopped what depends on /boot,
# rpm-ostreed included: a system update broke off halfway (2026-10-26, real machine). It never expires now.
[Automount]
TimeoutIdleSec=0
