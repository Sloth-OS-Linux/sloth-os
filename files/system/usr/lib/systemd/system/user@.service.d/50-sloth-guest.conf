# Sloth OS: the guest account (Sloth Center → Account and security) is emptied when its last session ends.
# "+": as root (user@.service itself runs as the user, who may not check or empty the account); "-": a failure
# never fails the user's service. guest-reset does nothing unless %i is the guest's user ID.
[Service]
ExecStopPost=-+/usr/libexec/sloth-os/guest-reset --uid %i
