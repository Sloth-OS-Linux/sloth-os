# Sloth OS: no automatic update while the user keeps an earlier version (Sloth Center -> Updates: going back or
# "Start this one next time" pauses it, installing an update or "Resume automatic updates" resumes it). Without this
# the update downloaded the newer version again and made it the one that starts next (2026-11-03, GitHub issue #17)
[Service]
ExecCondition=/usr/bin/test ! -e /etc/sloth-os/updates-paused
