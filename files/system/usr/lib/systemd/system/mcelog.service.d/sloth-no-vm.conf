# Sloth OS: not in a virtual machine. There is no hardware of its own to watch, and on a newer AMD processor (the
# host's, passed through) mcelog fails at every start ("CPU is unsupported"; edac_mce_amd, which keeps it off on real
# AMD hardware, is not loaded in a VM), so Sloth Center's System status warned about a service that did not start.
[Unit]
ConditionVirtualization=no
