# Announce the computer over IPv4 only. Over IPv6, wsdd gives a link-local address
# (http://[fe80::…%eth0]:5357/…); KDE's Network view cannot fetch the computer's name
# from it and shows the address instead of the name. Windows finds it over IPv4 too.
# ExecStart, not OPTIONS: /etc/sysconfig/wsdd sets OPTIONS and wins over Environment=.
[Service]
ExecStart=
ExecStart=/usr/bin/wsdd --shortlog --chroot=/run/wsdd --ipv4only $OPTIONS
