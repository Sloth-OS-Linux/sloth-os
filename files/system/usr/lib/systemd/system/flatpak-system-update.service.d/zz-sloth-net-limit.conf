# Sloth OS: the download speed limit "only while updates download" (Sloth Center -> System status,
# /usr/libexec/sloth-os/net-limit). "+": as root even where the service runs as its own user (rpm-ostreed);
# "-": the update goes on whatever happens to the limit.
[Service]
ExecStartPre=-+/usr/libexec/sloth-os/net-limit update-start
ExecStopPost=-+/usr/libexec/sloth-os/net-limit update-stop %n
