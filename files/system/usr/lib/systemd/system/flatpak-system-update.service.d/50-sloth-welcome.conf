# Sloth OS: az automatikus app-frissítés (ublue-os-update-services) ne fusson, amíg a Sloth Üdvözlő appokat
# telepít. Első induláskor a frissítő 2 perccel a bekapcsolás után indul, épp az Üdvözlő alatt, és a két
# Flatpak-tranzakció egymást akadályozhatja. Ilyenkor kimarad, és a következő alkalommal (naponta) fut.
# A [/] azért kell, hogy a minta a saját parancssorát ne találja meg.
[Service]
ExecCondition=/bin/sh -c '! pgrep -f "[/]usr/bin/sloth-welcome" >/dev/null'
