# Sloth OS: the automatic app update (ublue-os-update-services) must not run while Sloth Welcome installs
# apps. On first boot the updater starts 2 minutes after power-on, right during Welcome, and the two
# Flatpak transactions may get in each other's way. Then it is skipped, and it runs the next time (daily).
# The [/] is needed so the pattern does not find its own command line.
[Service]
ExecCondition=/bin/sh -c '! pgrep -f "[/]usr/bin/sloth-welcome" >/dev/null'
