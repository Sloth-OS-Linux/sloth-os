# The installer ISO's boot menu (Titanoboa makes the GRUB menu from this).
# The menu is hidden: after 2 seconds Sloth OS starts by itself; Esc brings it up (e.g. for the safe
# graphics mode). The build sets up the hiding (tools/build-iso.ps1, .github/workflows/iso.yml).
# The menu is in English, because the language can only be chosen in the installer.
label: "SlothOS-Live"
grub2:
  default: 0
  timeout: 2
  entries:
    - name: "Try or install Sloth OS"
      linux: "/images/pxeboot/vmlinuz quiet rhgb splash loglevel=3 rd.udev.log_level=3 systemd.show_status=false root=live:CDLABEL=SlothOS-Live enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Try or install Sloth OS (safe graphics)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb splash root=live:CDLABEL=SlothOS-Live enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
