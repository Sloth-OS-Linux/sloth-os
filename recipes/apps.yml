# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Nothing is preinstalled: everything (browser, office programs, media player, chat,
# Steam and other game stores, …) is chosen by the user at the first start in Sloth Welcome
# (files/system/usr/lib/sloth-os/sloth-welcome). The list of apps: sloth_welcome/catalog.py
# Windows programs run without Steam too (.exe handler, recipes/gaming.yml).
modules:
  # The Firefox RPM in the base image is removed; a browser can be chosen in the wizard
  - type: script
    scripts:
      - remove-default-apps.sh

  - type: default-flatpaks
    configurations:
      - notify: false # the user should not see a technical notification on the first start
        scope: system # the system-wide Flathub repository, without packages (Welcome installs from here)
      - notify: false # it spoke up at every login ("…installation of 0 user Flatpak(s)…"), 2026-10-20
        scope: user # the user Flathub repository, without packages
