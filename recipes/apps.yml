# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Előtelepített app nincs: mindent (böngésző, irodai programok, médialejátszó, csevegés,
# Steam és más játékboltok, …) a felhasználó választ ki első indításkor a Sloth Üdvözlőben
# (files/system/usr/lib/sloth-os/sloth-welcome). Az appok listája: sloth_welcome/catalog.py
# A Windows-programok Steam nélkül is futnak (.exe kezelő, recipes/gaming.yml).
modules:
  # Az alap image-ben lévő Firefox RPM kikerül; böngészőt a varázslóban lehet választani
  - type: script
    scripts:
      - remove-default-apps.sh

  - type: default-flatpaks
    configurations:
      - notify: false # a felhasználó ne lásson technikai értesítést első induláskor
        scope: system # Flathub rendszerszintű repó, csomagok nélkül (az Üdvözlő innen telepít)
      - notify: false # minden bejelentkezéskor szólt („…installation of 0 user Flatpak(s)…”), 2026-10-20
        scope: user # Flathub felhasználói repó, csomagok nélkül
