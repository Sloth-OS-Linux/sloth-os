# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Everything that gives the system its "face": name, logos, default settings.
modules:
  - type: files
    files:
      - source: system
        destination: / # the contents of files/system/* go into the root

  - type: dnf
    install:
      packages:
        - plymouth-plugin-script # the boot animation (files/system/usr/share/plymouth/themes/sloth-os) uses it
        # Fonts for every script (Chinese, Japanese, Korean, Arabic, Hebrew, Indian scripts, Lao, Georgian…),
        # so Sloth Welcome's language chooser and the interface are readable in any installer language
        - default-fonts-cjk-sans
        - default-fonts-other-sans
        # Chinese, Japanese and Korean typing (fcitx5; ibus goes in slim-image.sh). It is turned on at sign-in
        # only for those whose language needs it (/usr/libexec/sloth-os/input-method). No fcitx5-autostart: on
        # Wayland KWin starts it, and its GTK_IM_MODULE / QT_IM_MODULE variables would only get in the way
        - fcitx5
        - fcitx5-qt
        - fcitx5-gtk
        - fcitx5-configtool # its settings in System Settings
        - fcitx5-hangul # Korean
        - fcitx5-chinese-addons # Simplified Chinese (pinyin)
        - fcitx5-chewing # Traditional Chinese (zhuyin)
        - fcitx5-mozc # Japanese

  - type: script
    scripts:
      - branding.sh
      - theme.sh
      - plymouth.sh

  # Quiet boot: right after the vendor logo comes the Sloth OS animation,
  # without texts and a blinking cursor. (Anaconda used to add quiet/rhgb; our own
  # installer with bootc only gets what is listed here, so it is needed here too.)
  - type: kargs
    kargs:
      - quiet
      - rhgb
      - splash
      - loglevel=3
      - rd.udev.log_level=3
      - systemd.show_status=false
      - vt.global_cursor_default=0

  # The GRUB boot menu stays hidden; it only appears after a failed start
  # (/usr/lib/sloth-os/grub-custom.cfg, the successful start is reported by sloth-boot-ok).
  - type: systemd
    system:
      enabled:
        - sloth-boot-ok.service
        - sloth-hide-root-overlay.service # the system's root must not show in Dolphin (a 128 TB drive)
        - sloth-first-user.service   # the first account from the installer's data (instead of KDE Plasma Setup)
        - sloth-signed-updates.timer # the older installs' updates with signature verification too
        - sloth-boot-order.service   # next to Windows: if Windows put itself at the front of the order, back again
