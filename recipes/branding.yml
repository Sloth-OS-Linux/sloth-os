# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Minden, ami a rendszer "arcát" adja: név, logók, alapbeállítások.
modules:
  - type: files
    files:
      - source: system
        destination: / # a files/system/* tartalma a gyökérbe kerül

  - type: dnf
    install:
      packages:
        - plymouth-plugin-script # a boot animáció (files/system/usr/share/plymouth/themes/sloth-os) ezt használja
        # Betűtípusok minden írásrendszerhez (kínai, japán, koreai, arab, héber, indiai írások, lao, grúz…),
        # hogy a Sloth Üdvözlő nyelvválasztója és a felület bármelyik telepítői nyelven olvasható legyen
        - default-fonts-cjk-sans
        - default-fonts-other-sans

  - type: script
    scripts:
      - branding.sh
      - theme.sh
      - plymouth.sh

  # Csendes boot: a gyártói logó után rögtön a Sloth OS animáció jön,
  # szövegek és villogó kurzor nélkül. (A quiet/rhgb-t eddig az Anaconda tette hozzá; a saját
  # telepítő a bootc-vel csak az itt felsoroltakat kapja, ezért kell ide is.)
  - type: kargs
    kargs:
      - quiet
      - rhgb
      - splash
      - loglevel=3
      - rd.udev.log_level=3
      - systemd.show_status=false
      - vt.global_cursor_default=0

  # A GRUB boot menü rejtve marad; csak hibás indítás után jelenik meg
  # (/usr/lib/sloth-os/grub-custom.cfg, a sikeres indítást a sloth-boot-ok jelzi).
  - type: systemd
    system:
      enabled:
        - sloth-boot-ok.service
        - sloth-hide-root-overlay.service # a Dolphinban ne látszódjon a rendszer gyökere (128 TB-os meghajtó)
        - sloth-first-user.service   # az első fiók a telepítő adataiból (a KDE Plasma Setup helyett)
        - sloth-signed-updates.timer # a régebbi telepítések frissítései is aláírás-ellenőrzéssel
        - sloth-boot-order.service   # Windows mellett: ha a Windows a sorrend elejére tette magát, vissza
