# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Gaming réteg. A cél: a felhasználó soha ne lássa a Proton/Wine-t.
modules:
  - type: dnf
    install:
      packages:
        - gamescope # mikrokompozitor, felskálázás, HDR
        - mangohud  # FPS / teljesítmény overlay
        - gamemode  # CPU/GPU teljesítmény-mód játék közben
        # Tartalék futtató a Windows-programokhoz: ha a Proton még nincs letöltve és nincs
        # internet, ezzel indul az .exe (files/system/usr/lib/sloth-os/sloth-exe/sloth_exe/backend.py).
        # Szándékosan nem a teljes "wine" csomag: a wine-desktop "Wine …" menüpontokat és
        # saját .exe-társítást hozna, a felhasználó pedig ne lássa a Wine-t.
        - wine-core  # a wine parancs
        - wine-dxvk  # DirectX 9-11 Vulkanon (játékok)
        - wine-mono  # .NET-es programokhoz, telepítő ablak nélkül

  # Windows-programok: dupla kattintás egy .exe-re -> telepítés / futtatás (files/system/usr/lib/sloth-os/sloth-exe).
  # Steam nélkül is működik. A háttérben az umu-launcher + Proton fut; az umu nincs a Fedora
  # repóban, ezért rögzített verziójú GitHub RPM. A Protont bejelentkezés után a
  # sloth-windows-prepare.timer frissen tartja. Egy rögzített Proton és a Steam Linux Runtime gyárilag az
  # image-ben van (windows-runtime.sh), így az első .exe letöltés és internet nélkül, azonnal indul.
  - type: script
    scripts:
      - umu-launcher.sh
      - windows-runtime.sh
      - exe-handler.sh

  # A Flatpak Steamen belül a fenti RPM-ek nem látszanak, ezért a MangoHud és
  # gamescope Vulkan rétegeket Flatpakként is feltesszük, a Steam runtime-verziójához
  # igazítva (files/system/usr/libexec/sloth-os/steam-vulkan-layers).
  # A Steamben a Proton alapból be van kapcsolva minden játékra (egyszer, bejelentkezéskor;
  # ha a felhasználó kikapcsolja, nem írjuk felül): files/system/usr/libexec/sloth-os/steam-proton-default
  - type: systemd
    system:
      enabled:
        - sloth-steam-vulkan-layers.timer
        - sloth-nvidia-auto.timer        # NVIDIA-s gépen az NVIDIA-s változat a háttérben
    user:
      enabled:
        - sloth-steam-proton-default.service
        - sloth-windows-prepare.timer
        - sloth-nvidia-notify.path       # értesítés, ha az NVIDIA-s változat elkészült
        - sloth-nvidia-notify.service
        - sloth-steam-first-run.path     # értesítés, amíg a Steam az első indításnál letölti magát
