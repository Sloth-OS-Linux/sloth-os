# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Sloth OS – the NVIDIA variant (NVIDIA's open kernel module, built in)
# Finished image: ghcr.io/sloth-os-linux/sloth-os-nvidia
name: sloth-os-nvidia
description: Sloth OS – a desktop for everyday use and gaming, without a terminal (NVIDIA).

base-image: ghcr.io/ublue-os/kinoite-nvidia
image-version: latest

modules:
  - from-file: branding.yml
  - from-file: gaming.yml
  - from-file: apps.yml
  - from-file: tools.yml
  - from-file: rpm-ostree-fix.yml
  - type: script # the same content gives the same layers (chunkah): fixed modification times
    scripts:
      - normalize-mtimes.sh
  - type: initramfs # needed for the boot animation; keep it at the end, before signing
  - type: signing
  - type: script # also accepts the other variant's signature (switching AMD/Intel <-> NVIDIA)
    scripts:
      - signing-family.sh
      - normalize-mtimes.sh # last: the files written by the steps above too
