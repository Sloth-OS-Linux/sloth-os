# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# A Sloth OS saját GUI eszközeinek futtatókörnyezete (Sloth Központ, üdvözlő varázsló).
# Az eszközök forrása: files/system/usr/lib/sloth-os/<eszköz>/
modules:
  - type: dnf
    install:
      packages:
        - python3-pyside6   # Qt/QML Pythonból
        - python3-gobject   # D-Bus (rpm-ostree, Flatpak) a GLib-en keresztül
        - fuse-libs         # FUSE 2: az AppImage-ek futtatásához (Linuxos csomagok, sloth_common/apps/packages.py)
        # Bejelentkezési módok (Sloth Központ → Fiók és biztonság)
        - authselect        # a bejelentkezési módok be- és kikapcsolása (PAM)
        - fprintd-pam       # ujjlenyomat
        - pam-u2f           # biztonsági kulcs (FIDO2 / YubiKey), a felvételhez: pamu2fcfg
        - realmd            # céges fiók: csatlakozás Active Directory tartományhoz
        - adcli
        - sssd-ad
        # Nyomtató és szkenner (ha már benne vannak az alapban, a dnf nem csinál semmit)
        - hplip                           # HP nyomtatók és szkennerek illesztője (a HP gépek gyakoriak)
        - sane-backends-drivers-scanners  # a szkennerek illesztői
        - skanpage                        # szkennelés (KDE); hardvereszköz, mint a nyomtatók beállítása
        - fwupd                           # BIOS/firmware frissítés (LVFS), a Sloth Központ Frissítések oldala
        # Felhőtárhely (OneDrive, Google Drive) mappaként: /usr/libexec/sloth-os/cloud-drive
        - rclone
        - fuse3

  - type: systemd
    system:
      enabled:
        # A saját fájlok mentése (Sloth Központ → Fájlmentés, Dolphin → Korábbi verziók)
        - sloth-home-layout.service   # induláskor: a /var/home külön subvolume (a pillanatképekhez)
        - sloth-home-snapshot.timer   # óránként egy pillanatkép, a régiek ritkítása
    user:
      enabled:
        - sloth-github-bundle-update.timer   # a GitHub-csomagként telepített appok (pl. ArtCraft) napi frissítése

  # Karcsúsítás: csak az marad, ami a működéshez vagy a hibaelhárításhoz kell (maradjon a modulok végén)
  - type: script
    scripts:
      - pin-authselect.sh   # PIN-kódos bejelentkezés: a "sloth" authselect-profil (with-sloth-pin)
      - slim-image.sh
