# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# The runtime of Sloth OS's own GUI tools (Sloth Center, welcome wizard).
# The tools' source: files/system/usr/lib/sloth-os/<tool>/
modules:
  - type: dnf
    install:
      packages:
        - python3-pyside6   # Qt/QML from Python
        - python3-gobject   # D-Bus (rpm-ostree, Flatpak) through GLib
        - fuse-libs         # FUSE 2: for running AppImages (Linux packages, sloth_common/apps/packages.py)
        # Sign-in methods (Sloth Center → Account and security)
        - authselect        # turning sign-in methods on and off (PAM)
        - fprintd-pam       # fingerprint
        - pam-u2f           # security key (FIDO2 / YubiKey); for enrolling: pamu2fcfg
        - realmd            # work account: joining an Active Directory domain
        - adcli
        - sssd-ad
        # Printer and scanner (if they are already in the base, dnf does nothing)
        - hplip                           # drivers for HP printers and scanners (HP machines are common)
        - sane-backends-drivers-scanners  # the scanners' drivers
        - skanpage                        # scanning (KDE); hardware, like setting up printers
        - fwupd                           # BIOS/firmware updates (LVFS), on Sloth Center's Updates page
        # Cloud storage (OneDrive, Google Drive) as a folder: /usr/libexec/sloth-os/cloud-drive
        - rclone
        - fuse3

  - type: systemd
    system:
      enabled:
        # Backing up your own files (Sloth Center → File backup, Dolphin → Previous versions)
        - sloth-home-layout.service   # at startup: /var/home as a separate subvolume (for the snapshots)
        - sloth-home-snapshot.timer   # one snapshot an hour, thinning out the old ones
        # resetting the computer, if requested in Sloth Center (at startup, before login)
        - sloth-factory-reset.service
        - sloth-boot-reset.service    # the same, requested from the boot menu (the files stay)
        - sloth-login-repair.service  # the login screen must not get lost after an authselect change
    user:
      enabled:
        - sloth-github-bundle-update.timer   # daily update of the apps installed as GitHub packages (e.g. ArtCraft)
        # a notification when a system update was prepared in the background (it installs at the next restart)
        - sloth-update-notify.path
        - sloth-update-notify.service
        # the Windows programs' taskbar balloons next to the taskbar (not in the top left corner of the screen)
        - sloth-wine-balloons.service

  # Slimming: only what is needed to work or to troubleshoot stays (keep it at the end of the modules)
  - type: script
    scripts:
      - pin-authselect.sh   # PIN sign-in: the "sloth" authselect profile (with-sloth-pin)
      - slim-image.sh
