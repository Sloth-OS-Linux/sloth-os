# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# A Sloth OS saját GUI eszközeinek futtatókörnyezete (Sloth Központ, üdvözlő varázsló).
# Az eszközök forrása: files/system/usr/lib/sloth-os/<eszköz>/
modules:
  - type: dnf
    install:
      packages:
        - python3-pyside6   # Qt/QML Pythonból
        - python3-gobject   # D-Bus (rpm-ostree, Flatpak) a GLib-en keresztül
        # Bejelentkezési módok (Sloth Központ → Fiók és biztonság)
        - authselect        # a bejelentkezési módok be- és kikapcsolása (PAM)
        - fprintd-pam       # ujjlenyomat
        - pam-u2f           # biztonsági kulcs (FIDO2 / YubiKey), a felvételhez: pamu2fcfg
        - realmd            # céges fiók: csatlakozás Active Directory tartományhoz
        - adcli
        - sssd-ad

  # A GitHub-csomagként telepített appok (pl. ArtCraft) napi frissítése a háttérben
  - type: systemd
    user:
      enabled:
        - sloth-github-bundle-update.timer
