# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# The runtime of Sloth OS's own GUI tools (Sloth Center, welcome wizard).
# The tools' source: files/system/usr/lib/sloth-os/<tool>/
modules:
  - type: dnf
    install:
      packages:
        - python3-pyside6   # Qt/QML from Python
        - python3-gobject   # D-Bus (rpm-ostree, Flatpak) through GLib
        - fuse-libs         # FUSE 2: for running AppImages (Linux packages, sloth_common/apps/packages.py)
        - fastfetch         # system information with the Sloth OS logo drawn in characters (/etc/fastfetch)
        # Sign-in methods (Sloth Center → Account and security)
        - authselect        # turning sign-in methods on and off (PAM)
        - fprintd-pam       # fingerprint
        - pam-u2f           # security key (FIDO2 / YubiKey); for enrolling: pamu2fcfg
        - realmd            # work account: joining an Active Directory domain
        # Printer and scanner (if they are already in the base, dnf does nothing)
        - hplip                           # drivers for HP printers and scanners (HP machines are common)
        - sane-backends-drivers-scanners  # the scanners' drivers
        - skanpage                        # scanning (KDE); hardware, like setting up printers
        - fwupd                           # BIOS/firmware updates (LVFS), on Sloth Center's Updates page
        - iproute-tc                      # tc: the download speed limit (Sloth Center → System status, net-limit)
        # Cloud storage (OneDrive, Google Drive) as a folder: /usr/libexec/sloth-os/cloud-drive
        - rclone
        - fuse3
        # Folder sharing (Dolphin → Share, Sloth Center → Network folders): the computer shows up in Windows'
        # Network window; the firewall opens only while something is shared (/usr/libexec/sloth-os/file-sharing)
        - wsdd
        - samba                       # SMB server and usershare commands
        - samba-winbind               # AD sign-in and group ACLs (Sloth Center joins with Winbind)
        - samba-winbind-clients       # wbinfo: map AD group names and SIDs for share ACLs
        - samba-common-tools          # net, pdbedit, smbpasswd and testparm
        - samba-usershares            # usershares group, directory and Samba configuration
        - kdenetwork-filesharing      # Dolphin → Properties → Share
        # Parental controls (Sloth Center → Parental controls): malcontent keeps the settings (AccountsService) and
        # the screen time used (malcontent-timerd); Flatpak refuses blocked apps by itself. Our screen-time service
        # does what GNOME's shell does: it records the time and signs the child out (/usr/libexec/sloth-os/screen-time)
        - malcontent
        - malcontent-tools            # malcontent-client: for looking at the settings when something goes wrong
        # the web filter for child accounts (/usr/libexec/sloth-os/family-web): a dnsmasq only for their lookups
        - dnsmasq
        - nftables

  - type: systemd
    system:
      enabled:
        # Dolphin's Share tab expects Samba to be enabled and running before it can configure a share.
        # With no shares the firewall stays closed and smb.conf exports nothing.
        - smb.service
        # Backing up your own files (Sloth Center → File backup, Dolphin → Previous versions)
        - sloth-home-layout.service   # at startup: /var/home as a separate subvolume (for the snapshots)
        - sloth-home-snapshot.timer   # one snapshot an hour, thinning out the old ones
        # resetting the computer, if requested in Sloth Center (at startup, before login)
        - sloth-factory-reset.service
        - sloth-boot-reset.service    # the same, requested from the boot menu (the files stay)
        - sloth-login-repair.service  # the login screen must not get lost after an authselect change
        # sharing a folder on the home network from Dolphin (Properties → Share): the group, then Samba when needed
        - sloth-file-sharing-groups.service
        - sloth-file-sharing.path
        - sloth-file-sharing.service  # at startup, if something is still shared
        - sloth-screen-time.service   # parental controls: a child's screen time (does nothing without a child)
        - sloth-family-web.service    # parental controls: the web filter (does nothing without a child who has it)
    user:
      enabled:
        - sloth-github-bundle-update.timer   # daily update of the apps installed as GitHub packages (e.g. ArtCraft)
        # a notification when a system update was prepared in the background (it installs at the next restart)
        - sloth-update-notify.path
        - sloth-update-notify.service
        # parental controls in a child's session: the screen time warnings, the blocked apps hidden
        - sloth-family-session.path
        - sloth-family-session.service
        # the question at a new network, as in Windows: private (shared folders open) or public (hidden)
        - sloth-network-notify.path
        - sloth-network-notify.service
        # the Windows programs' taskbar balloons next to the taskbar (not in the top left corner of the screen)
        - sloth-wine-balloons.service
        # disc images (.iso) opened with a double-click are ejected at sign-out
        - sloth-disc-images.service

  # Slimming: only what is needed to work or to troubleshoot stays (keep it at the end of the modules)
  - type: script
    scripts:
      - install-net-wrapper.sh # the Dolphin KAuth helper needs the shim at /usr/bin/net
      - pin-authselect.sh   # PIN sign-in: the "sloth" authselect profile (with-sloth-pin)
      - kwallet-autologin.sh  # automatic sign-in on an encrypted disk: the boot password opens KWallet
      - screen-time-pam.sh    # parental controls: a child outside their screen time is not let in
      - slim-image.sh
