# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Sloth OS – the variant for AMD / Intel GPUs
# Finished image: ghcr.io/sloth-os-linux/sloth-os
name: sloth-os
description: Sloth OS – a desktop for everyday use and gaming, without a terminal.

# Universal Blue KDE (Kinoite) base – NOT Bazzite
base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest # can be pinned to a Fedora version later, e.g. 43

modules:
  - from-file: branding.yml
  - from-file: gaming.yml
  - from-file: apps.yml
  - from-file: tools.yml
  - from-file: rpm-ostree-fix.yml
  - type: script # the same content gives the same layers (chunkah): fixed modification times
    scripts:
      - normalize-mtimes.sh
  - type: initramfs # needed for the boot animation; keep it at the end, before signing
  - type: signing # needed for signed images, keep it at the end
  - type: script # also accepts the other variant's signature (switching AMD/Intel <-> NVIDIA)
    scripts:
      - signing-family.sh
      - normalize-mtimes.sh # last: the files written by the steps above too
