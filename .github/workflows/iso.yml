name: iso
# Builds the Sloth OS installer ISO (can be started by hand from the GitHub interface: Actions -> iso -> Run workflow).
# It follows the same steps as the local build: tools/build-iso.sh / tools/build-iso.ps1
#
# While the repository was private the ISO could not be uploaded (the Actions storage is 500 MB, an ISO several GB),
# so the workflow only checked that it builds. In the public repository it can be downloaded as an artifact.
on:
  # A test-only path filter lets us produce a test ISO by changing this workflow,
  # without rebuilding the system image or affecting normal pushes.
  # A change to the installer or to its test builds an ISO from the test branch image and clicks through it as well.
  push:
    branches: [test/chunked-oci]
    paths: [.github/workflows/iso.yml, "iso/**", tools/tests/gui_install_test.py]
  # build.yml calls this after every image build: the ISO of exactly that image, installed by the GUI test
  workflow_call:
    inputs:
      variant:
        type: string
        default: sloth-os
      image_tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant"
        type: choice
        options: [sloth-os, sloth-os-nvidia]
        default: sloth-os
      squash:
        description: "Squash the layers (no longer supported: a squashed image cannot be installed)"
        type: boolean
        default: false
      image_tag:
        description: "Image tag to install (for example a branch build tag)"
        type: string
        default: latest

env:
  VARIANT: ${{ inputs.variant || 'sloth-os' }}
  IMAGE_TAG: ${{ inputs.image_tag || 'br-test_chunked-oci-44' }}
  SQUASH: ${{ inputs.squash || false }}

jobs:
  iso:
    name: Build ISO
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          large-packages: false

      - uses: actions/checkout@v4

      - name: Registry login
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin --authfile /tmp/auth.json
          sudo chmod 0644 /tmp/auth.json

      - name: Build live image
        run: |
          owner="${{ github.repository_owner }}"  # ghcr.io only accepts lowercase names (Sloth-OS-Linux)
          image="ghcr.io/${owner,,}/${VARIANT}:${IMAGE_TAG}"
          sudo podman build --security-opt label=disable --authfile /tmp/auth.json \
            --build-arg BASE_IMAGE="$image" -t localhost/sloth-os-live:latest iso/
          # The unpacked container storage of the image to install goes into a separate folder (iso/payload.sh); when
          # the ISO is made it is mounted in place of the live system's /var/lib/containers/storage (no podman commit).
          # It is not downloaded again: the unpacker reads from the storage downloaded while building the live system.
          src="$image"
          if [ "$SQUASH" = "true" ]; then
            # a squashed image cannot be installed ("Too many links" in bootc; tools/build-iso.sh, SLOTH_SQUASH)
            echo "::error::Squashing is no longer supported: a squashed image cannot be installed"
            exit 1
          fi
          driver="$(sudo podman info --format '{{.Store.GraphDriverName}}')"
          sudo mkdir -p /tmp/payload
          sudo podman run --rm --privileged --network none \
            -v "$PWD/iso/payload.sh":/payload.sh:ro \
            -v /var/lib/containers/storage:/outer/storage \
            -v /tmp/payload:/var/lib/containers/storage \
            localhost/sloth-os-live:latest bash /payload.sh "$image" "containers-storage:[$driver@/outer/storage+/run/outer]$src"
          sudo rm -f /tmp/auth.json

      - name: Build ISO (iso/build_iso.sh, Titanoboa's with the hidden menu)
        run: |
          mkdir -p output
          sudo podman run --rm --cap-add sys_admin --security-opt label=disable \
            -v "$PWD/iso/build_iso.sh":/src/build_iso.sh:ro \
            --mount type=image,source=localhost/sloth-os-live:latest,dst=/rootfs \
            -v /tmp/payload:/rootfs/var/lib/containers/storage:ro \
            -v "$PWD/output":/output \
            quay.io/fedora/fedora:latest bash -exo pipefail /src/build_iso.sh

      - name: Checksum
        run: |
          sudo chown -R "$(id -u):$(id -g)" output
          mv output/*.iso "output/${VARIANT}.iso"
          (cd output && sha256sum "${VARIANT}.iso" | tee "${VARIANT}.iso.sha256")
          ls -lh output

      - name: Upload ISO
        if: ${{ !github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.variant || 'sloth-os' }}-iso
          path: output/
          # the ISO of every build (build.yml) is only needed by the test below
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 7 || 1 }}

  # The ISO installed the way a person does it: a virtual machine (KVM on the GitHub runner) starts it, and
  # tools/tests/gui_install_test.py clicks through the real installer by reading the screen, restarts, signs in and
  # waits for Sloth Welcome. The installer has no unattended mode, and the test needs none.
  gui-install-test:
    name: GUI install test
    needs: iso
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          large-packages: false

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.variant || 'sloth-os' }}-iso
          path: output

      - name: Install QEMU and OCR
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y qemu-system-x86 qemu-utils ovmf tesseract-ocr python3-pil > /dev/null

      - name: Install, restart, sign in
        run: sudo python3 tools/tests/gui_install_test.py "output/${VARIANT}.iso" "$PWD/gui-test"

      - name: Result
        if: always()
        run: |
          {
            echo "### GUI install test"
            ls gui-test/shots 2>/dev/null | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-install-test-${{ inputs.variant || 'sloth-os' }}
          path: |
            gui-test/shots/
            gui-test/serial-*.log
          retention-days: 7
