name: iso
# Builds the Sloth OS installer ISO (can be started by hand from the GitHub interface: Actions -> iso -> Run workflow).
# It follows the same steps as the local build: tools/build-iso.sh / tools/build-iso.ps1
#
# While the repository was private the ISO could not be uploaded (the Actions storage is 500 MB, an ISO several GB),
# so the workflow only checked that it builds. In the public repository it can be downloaded as an artifact.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant"
        type: choice
        options: [sloth-os, sloth-os-nvidia]
        default: sloth-os
      squash:
        description: "Squash the layers (a smaller ISO; the installed machine's first update downloads the whole image)"
        type: boolean
        default: false

env:
  # The pinned commit of the Titanoboa ISO builder (when updating: change the SHA in tools/build-iso.sh too)
  TITANOBOA_COMMIT: 5c457c3d0518bd17e754be0fd98a60d29d26abb4

jobs:
  iso:
    name: Build ISO
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          large-packages: false

      - uses: actions/checkout@v4

      - name: Registry login
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin --authfile /tmp/auth.json
          sudo chmod 0644 /tmp/auth.json

      - name: Build live image
        run: |
          owner="${{ github.repository_owner }}"  # ghcr.io only accepts lowercase names (Sloth-OS-Linux)
          image="ghcr.io/${owner,,}/${{ inputs.variant }}:latest"
          sudo podman build --security-opt label=disable --authfile /tmp/auth.json \
            --build-arg BASE_IMAGE="$image" -t localhost/sloth-os-live:latest iso/
          # The unpacked container storage of the image to install goes into a separate folder (iso/payload.sh); when
          # the ISO is made it is mounted in place of the live system's /var/lib/containers/storage (no podman commit).
          # It is not downloaded again: the unpacker reads from the storage downloaded while building the live system.
          src="$image"
          if [ "${{ inputs.squash }}" = "true" ]; then
            mkdir -p /tmp/squash && printf 'FROM %s\n' "$image" > /tmp/squash/Containerfile
            sudo podman build --pull=never --squash-all --network none --security-opt label=disable \
              -t localhost/sloth-os-payload:latest -f /tmp/squash/Containerfile /tmp/squash
            src="localhost/sloth-os-payload:latest"
          fi
          driver="$(sudo podman info --format '{{.Store.GraphDriverName}}')"
          sudo mkdir -p /tmp/payload
          sudo podman run --rm --privileged --network none \
            -v "$PWD/iso/payload.sh":/payload.sh:ro \
            -v /var/lib/containers/storage:/outer/storage \
            -v /tmp/payload:/var/lib/containers/storage \
            localhost/sloth-os-live:latest bash /payload.sh "$image" "containers-storage:[$driver@/outer/storage+/run/outer]$src"
          sudo rm -f /tmp/auth.json

      - name: Build ISO (Titanoboa)
        run: |
          curl -fsSL -o /tmp/build_iso.sh \
            "https://raw.githubusercontent.com/ublue-os/titanoboa/${TITANOBOA_COMMIT}/build_iso.sh"
          # Hidden GRUB menu: by default Sloth OS starts right away, Esc brings the menu up (iso/iso.yaml)
          grep -q "set menu_auto_hide=false" /tmp/build_iso.sh
          sed -i "s/set menu_auto_hide=false/set timeout_style=hidden/" /tmp/build_iso.sh
          mkdir -p output
          sudo podman run --rm --cap-add sys_admin --security-opt label=disable \
            -v /tmp/build_iso.sh:/src/build_iso.sh:ro \
            --mount type=image,source=localhost/sloth-os-live:latest,dst=/rootfs \
            -v /tmp/payload:/rootfs/var/lib/containers/storage:ro \
            -v "$PWD/output":/output \
            quay.io/fedora/fedora:latest bash -exo pipefail /src/build_iso.sh

      - name: Checksum
        run: |
          sudo chown -R "$(id -u):$(id -g)" output
          mv output/*.iso "output/${{ inputs.variant }}.iso"
          (cd output && sha256sum "${{ inputs.variant }}.iso" | tee "${{ inputs.variant }}.iso.sha256")
          ls -lh output

      - name: Upload ISO
        if: ${{ !github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.variant }}-iso
          path: output/
          retention-days: 7
