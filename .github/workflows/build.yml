name: bluebuild
on:
  # Napi build (a repó publikus, az Actions-percek ingyenesek): így a Fedora / Universal Blue javításai
  # akkor is megérkeznek a gépekre, ha nálunk nincs új commit
  schedule:
    - cron: "00 06 * * *" # naponta 06:00 UTC, a ublue alap image-ek után
  push:
    paths-ignore:
      - "**.md"
      # ezek nem kerülnek bele az image-be (telepítő ISO, fejlesztői segédek, dokumentáció)
      - "iso/**"
      - "tools/**"
      - "docs/**"
      - ".github/workflows/iso.yml"
  pull_request:
  workflow_dispatch: # kézi indítás a GitHub felületről

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  # A main ágon a futó buildet nem szakítjuk meg (az újabb megvárja): a build előbb feltölti a "latest"-et, és csak
  # utána írja alá. Ha közben megszakad, a "latest" aláíratlan marad, és az aláírás-ellenőrzéssel frissítő gépek
  # (ostree-image-signed) a következő teljes buildig nem tudnak frissíteni (2026-10-19-én megtörtént).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bluebuild:
    name: Build Sloth OS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml        # AMD / Intel
          - recipe-nvidia.yml # NVIDIA
    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
