name: bluebuild
on:
  # Daily build (the repository is public, Actions minutes are free): so the Fedora / Universal Blue fixes
  # reach the machines even when there is no new commit here
  schedule:
    - cron: "00 06 * * *" # daily at 06:00 UTC, after the ublue base images
  push:
    paths-ignore:
      - "**.md"
      # these do not go into the image (installer ISO, developer tools, documentation)
      - "iso/**"
      - "tools/**"
      - "docs/**"
      - ".github/workflows/iso.yml"
  pull_request:
  workflow_dispatch: # start by hand from the GitHub interface

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  # On the main branch a running build is not cancelled (the newer one waits): the build first pushes "latest", and only
  # signs it afterwards. If it is interrupted meanwhile, "latest" stays unsigned, and machines updating with signature
  # verification (ostree-image-signed) cannot update until the next full build (it happened on 2026-10-19).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bluebuild:
    name: Build Sloth OS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      # The chunkah version, pinned (the BlueBuild CLI reads it; the action has no input for it): with "latest" a
      # new chunkah could change every layer of the next update by itself. v0.7.1 is the image "latest" was on
      # 2026-10-28 (sha256:71e59342…). A tag, not a digest: CLI 0.9.37 takes only 32-character digests.
      BB_BUILD_CHUNKAH_VERSION: v0.7.1
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml        # AMD / Intel
          - recipe-nvidia.yml # NVIDIA
    steps:
      - name: Build Custom Image
        id: build
        # A registry that does not answer for a moment (ghcr.io 503 while pulling the base image, 2026-10-28;
        # quay.io 502 the day before) must not fail the build: the second attempt below builds it again. A failed
        # build pushes nothing, so the machines stay on the last good image either way.
        continue-on-error: true
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          # Content-based layers: an update downloads only what changed, not every one of our layers again
          # (~2.3 GB per build without it, measured 2026-10-26). build_chunked_oci crashed in rpm-ostree 2026.2 from
          # the second build on (it starts from the previous image); chunkah does not use the previous image
          chunkah: true

      - name: Free the space of the failed attempt
        if: steps.build.outcome == 'failure'
        run: |
          podman system prune --all --force || true
          sudo podman system prune --all --force || true
          sleep 60   # give the registry a minute

      - name: Build Custom Image (second attempt)
        if: steps.build.outcome == 'failure'
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: false   # done by the first attempt
          chunkah: true

  # The finished image must be installable: bootc installs it onto a disk file, the same way the installer does.
  # A squashed image once passed the build but could not be installed ("Missing ostree.final-diffid").
  install-test:
    name: Install test
    needs: bluebuild
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          large-packages: false

      - name: Install onto a disk file
        run: |
          owner="${{ github.repository_owner }}"  # ghcr.io only accepts lowercase names
          repo="ghcr.io/${owner,,}/sloth-os"
          # the build tags the image with the short commit and the Fedora version (e.g. d1cd0ee-44)
          sha="${GITHUB_SHA::7}"
          tag=$(skopeo list-tags "docker://$repo" | jq -r '.Tags[]' | grep -E "^${sha}-[0-9]+$" | head -1)
          [ -n "$tag" ] || { echo "::error::No image tagged ${sha}-<version>"; exit 1; }
          echo "Image: $repo:$tag"
          sudo podman pull "$repo:$tag"
          sudo podman image inspect "$repo:$tag" > image.json
          echo "Layers: $(jq '.[0].RootFS.Layers | length' image.json)"
          # the same check the installer makes before it touches the disk (sloth-install-helper: verify_image)
          final=$(jq -r '.[0].Labels["ostree.final-diffid"] // empty' image.json)
          if [ -n "$final" ] && ! jq -e --arg f "$final" '.[0].RootFS.Layers | index($f)' image.json >/dev/null; then
            echo "::error::The layer named by ostree.final-diffid is missing: $final"; exit 1
          fi
          # What a machine on the previous build would download: the layers that are not in that image
          before="${{ github.event.before }}"
          prev=$(skopeo list-tags "docker://$repo" | jq -r '.Tags[]' | grep -E "^${before::7}-[0-9]+$" | head -1)
          if [ -n "$prev" ]; then
            skopeo inspect "docker://$repo:$prev" | jq '[.LayersData[] | {(.Digest): .Size}] | add' > prev.json
            skopeo inspect "docker://$repo:$tag" | jq -r --arg prev "$prev" --slurpfile p prev.json \
              '[.LayersData[] | select($p[0][.Digest] == null) | .Size] as $new | "Update from \($prev): \($new | length) new layers of \(.LayersData | length), \(($new | add // 0) / 1048576 | floor) MB to download (the whole image: \([.LayersData[].Size] | add / 1048576 | floor) MB)"' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No image of the previous push (${before::7}) to compare with"
          fi
          mkdir -p out && truncate -s 40G out/disk.raw
          # the image has no install configuration of its own: btrfs, as the installer makes it
          sudo podman run --rm --privileged --pid=host --security-opt label=type:unconfined_t \
            -v /var/lib/containers:/var/lib/containers -v /dev:/dev -v "$PWD/out:/output" \
            "$repo:$tag" bootc install to-disk --via-loopback --generic-image --skip-fetch-check --wipe \
            --filesystem btrfs --karg console=ttyS0,115200n8 /output/disk.raw

      # The installed disk must also start: a UEFI virtual machine (KVM on the GitHub runner) boots it, and the
      # test waits for the login prompt on the serial console (the console karg above). Emergency mode, a kernel
      # panic or no prompt in 15 minutes fails it.
      - name: Boot the installed disk
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y qemu-system-x86 ovmf > /dev/null
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          sudo qemu-system-x86_64 -enable-kvm -machine q35 -cpu host -smp 2 -m 4096 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=out/disk.raw,format=raw,if=virtio \
            -display none -monitor none -serial file:serial.log &
          qemu=$!
          result=timeout
          for _ in $(seq 180); do
            sleep 5
            if grep -qE "login:" serial.log 2>/dev/null; then result=ok; break; fi
            if grep -qE "Kernel panic|emergency mode|Failed to start .*Switch Root|You are in emergency" serial.log 2>/dev/null; then result=failed; break; fi
          done
          sudo kill "$qemu" 2>/dev/null || true
          echo "--- the end of the serial console:"; tail -40 serial.log | cut -c1-200
          echo "Boot test: $result" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$result" = ok ]
