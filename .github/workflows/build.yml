name: bluebuild
on:
  # A napi build ki van kapcsolva, amíg a repó privát (havi 2000 perces Actions-keret).
  # Ha publikus lesz / lesznek felhasználók, vissza kell kapcsolni (ROADMAP 4. fázis).
  # schedule:
  #   - cron: "00 06 * * *" # naponta 06:00 UTC, a ublue alap image-ek után
  push:
    paths-ignore:
      - "**.md"
      # ezek nem kerülnek bele az image-be (telepítő ISO, fejlesztői segédek, dokumentáció, weboldal)
      - "iso/**"
      - "tools/**"
      - "docs/**"
      - "website/**"
      - ".github/workflows/iso.yml"
      - ".github/workflows/pages.yml"
  pull_request:
  workflow_dispatch: # kézi indítás a GitHub felületről

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build Sloth OS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml        # AMD / Intel
          - recipe-nvidia.yml # NVIDIA
    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
